
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing Game Leaderboard</title>
<style>
body {
  font-family: monospace;
  margin: 32px auto;
  padding: 0 16px;
  max-width: 850px;
  line-height: 1.6;
}
table {
  border-collapse: collapse;
  width: 100%;
}
th, td {
  border: 1px solid black;
  padding: 12px;
  text-align: center;
}
</style>
</head>
<body>

<h1>Typing Game Leaderboard</h1>

<table>
  <tr>
    <th>Rank</th>
    <th>Username</th>
    <th>Best Time</th>
  </tr>

  {% for username, seconds in leaderboard %}
  <tr>
    <td>{{ loop.index }}</td>
    <td>{{ username }}</td>
    <td>{{ "%.2f"|format(seconds) }} seconds</td>
  </tr>
  {% endfor %}
</table>

<p><a href="/">Back to Game</a></p>

</body>
</html>
